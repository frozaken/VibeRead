name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Mac app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          xcodebuild \
            -project "Vibe Read.xcodeproj" \
            -scheme "Vibe Read" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/viberead-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          xcodebuild \
            -project "Vibe Read.xcodeproj" \
            -scheme "Vibe Read" \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/viberead-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:"Vibe ReadTests" \
            test

  website:
    name: Static website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build
